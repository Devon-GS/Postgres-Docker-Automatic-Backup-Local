[database]
# The name of the running Docker container
docker_container_name = <information>

# Database credentials
username = <information>
database_name = <information>

[backup]
# Number of backups to keep before deleting the oldest
max_backups = 5
backup_prefix = backup_

[uploads]
# Set to true to back up uploaded files, or false to skip
enabled = false
# The container name where the uploads folder lives
container_name = <information>
# The path inside the container
container_path = <information>
# Prefix for the upload zip files
backup_prefix = uploads_